name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
      - feature/security-pipeline

  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-report.json
      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 30
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    needs: semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-report.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy filesystem report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          retention-days: 30
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: trivy-fs

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-api-calculator:${{ github.sha }} \
            .
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: devsecops-api-calculator:${{ github.sha }}
          format: json
          output: trivy-image-report.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload Trivy image report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-image-report
          path: trivy-image-report.json
      - name: Run Docker container
        run: |
          docker run -d \
            --name devsecops-calculator \
            -p 8000:8000 \
            devsecops-api-calculator:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Check application health
        run: |
          curl --fail http://localhost:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs devsecops-calculator

      - name: Stop container
        if: always()
        run: |
          docker stop devsecops-calculator || true
          docker rm devsecops-calculator || true
