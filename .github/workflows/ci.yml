name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-api-calculator:${{ github.sha }} \
            .
      - name: Run Docker container
        run: |
          docker run -d \
            --name devsecops-calculator \
            -p 8000:8000 \
            devsecops-api-calculator:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Check application health
        run: |
          curl --fail http://localhost:8000/health

      - name: Show container logs on failure
        if: failure()
        run: docker logs devsecops-calculator

      - name: Stop container
        if: always()
        run: |
          docker stop devsecops-calculator || true
          docker rm devsecops-calculator || true
